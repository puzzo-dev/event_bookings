[project]
name = "event_bookings"
authors = [
    { name = "I-Varse Technologies NG", email = "dev@itechnologies.ng"}
]
description = "Event Management"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
python-semantic-release = "~=9.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

# ---------------------------------------------------------------------------
# Semantic Release
# ---------------------------------------------------------------------------
# Run:  semantic-release version   (bumps version + tags)
#       semantic-release publish   (also pushes tag to remote)
#
# Commit convention (Angular / Conventional Commits):
#   feat:     → minor bump  (new feature)
#   fix:      → patch bump  (bug fix)
#   refactor: → patch bump  (code change with no visible behaviour change)
#   perf:     → patch bump  (performance improvement)
#   BREAKING CHANGE footer or feat!: → major bump
#   chore / docs / style / test → no bump
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_variables = ["event_bookings/__init__.py:__version__"]
branch = "version-15"
commit_parser = "conventional"
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
upload_to_pypi = false
upload_to_release = false

[tool.semantic_release.remote]
# No push to remote by default — CI/CD can override this
push = false
type = "github"
ignore_token_for_push = true

[tool.semantic_release.branches.version-15]
match = "version-15"
prerelease = false

[tool.semantic_release.commit_parser_options]
# Commits that trigger a MINOR version bump
minor_tags = ["feat"]
# Commits that trigger a PATCH version bump
# "refactor" added here so code clean-ups count as a fix/patch
patch_tags = ["fix", "perf", "refactor"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
