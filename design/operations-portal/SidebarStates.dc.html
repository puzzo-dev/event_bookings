<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; min-height: 960px; background: #FFFFFF; padding: 32px; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 13px; color: #6B6B6B">Expanded · 14rem</span><div style="border: 1px solid #EDEDED; border-radius: 12px; overflow: hidden"><dc-import name="EvSidebar" active="production" role="Owner" hint-size="224px,900px"></dc-import></div></div>
<div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 13px; color: #6B6B6B">Collapsed · 3rem. Hover shows the name.</span><div style="border: 1px solid #EDEDED; border-radius: 12px; overflow: hidden"><dc-import name="EvSidebar" active="production" role="Owner" collapsed="true" hint-size="48px,900px"></dc-import></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":960}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
