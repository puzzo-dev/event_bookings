{% extends "templates/web.html" %}

{% block title %}My Event Bookings{% endblock %}

{% block page_content %}
<div class="container py-4">
    <h2>My Event Bookings</h2>
    <p class="text-muted">View and manage your event bookings.</p>

    <div id="bookings-list">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Loading your bookings...</p>
        </div>
    </div>
    <div id="load-more-wrapper" class="text-center py-3" style="display: none;">
        <button id="load-more-btn" class="btn btn-default btn-sm">Load More</button>
    </div>
</div>

<style>
.booking-card {
    border: 1px solid var(--border-color, #d1d8dd);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    background: var(--card-bg, #fff);
}
.booking-card:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.booking-status {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.85em;
    font-weight: 600;
}
.status-new { background: #e3f2fd; color: #1565c0; }
.status-quoted { background: #fff3e0; color: #e65100; }
.status-confirmed { background: #e8f5e9; color: #2e7d32; }
.status-in-preparation { background: #f3e5f5; color: #7b1fa2; }
.status-executed { background: #e0f2f1; color: #00695c; }
.status-invoiced { background: #fce4ec; color: #c62828; }
.status-paid { background: #e8f5e9; color: #1b5e20; }
.status-cancelled { background: #efebe9; color: #4e342e; }
.booking-meta { color: var(--text-muted, #8d99a6); font-size: 0.9em; }
</style>

<script>
var PAGE_SIZE = 20;
var current_start = 0;
var all_loaded = false;

frappe.ready(function() {
    load_bookings(0);

    $('#load-more-btn').on('click', function() {
        load_bookings(current_start);
    });
});

function load_bookings(start) {
    frappe.call({
        method: 'event_bookings.api.portal.get_customer_bookings',
        args: { limit_start: start, limit_page_length: PAGE_SIZE },
        callback: function(r) {
            var bookings = r.message || [];
            if (start === 0 && bookings.length === 0) {
                $('#bookings-list').html(
                    '<div class="text-center py-5 text-muted">' +
                    '<p>No bookings found.</p></div>'
                );
                return;
            }
            if (start === 0) {
                $('#bookings-list').html('');
            }
            render_bookings(bookings);
            current_start += bookings.length;

            if (bookings.length < PAGE_SIZE) {
                all_loaded = true;
                $('#load-more-wrapper').hide();
            } else {
                $('#load-more-wrapper').show();
            }
        }
    });
}

function render_bookings(bookings) {
    var html = '';
    bookings.forEach(function(b) {
        var status_class = 'status-' + b.booking_status.toLowerCase().replace(/ /g, '-');
        html += '<div class="booking-card">' +
            '<div class="row">' +
            '<div class="col-md-8">' +
            '<h5>' + b.event_name + ' <span class="booking-status ' + status_class + '">' +
            b.booking_status + '</span></h5>' +
            '<div class="booking-meta">' +
            '<span>Date: ' + b.event_date + '</span> &nbsp; ' +
            '<span>Location: ' + (b.event_location || '') + '</span>' +
            '</div>' +
            '</div>' +
            '<div class="col-md-4 text-right">' +
            '<div class="booking-meta">Estimated: ' + format_currency(b.total_estimated) + '</div>';

        if (b.booking_status === 'Quoted' && !b.sales_order) {
            html += '<button class="btn btn-primary btn-sm mt-2" onclick="approve_booking(\'' +
                b.name + '\')">Approve Quote</button>';
        }

        html += '</div></div></div>';
    });
    $('#bookings-list').append(html);
}

function approve_booking(name) {
    frappe.call({
        method: 'event_bookings.api.portal.approve_quotation',
        args: { event_booking: name },
        callback: function(r) {
            if (r.message && r.message.status === 'success') {
                frappe.msgprint(__('Booking confirmed successfully.'));
                setTimeout(function() { location.reload(); }, 1500);
            }
        }
    });
}

function format_currency(val) {
    if (!val) return '—';
    return frappe.format(val, {fieldtype: 'Currency'});
}
</script>
{% endblock %}
